[package]
name = "akr-physics-core"
version = "1.0.0"
edition = "2021"
authors = ["Ajith Kumar Racing Team <engineering@ajithkumarracing.com>"]
description = "Ultra-low latency vehicle dynamics, downforce vector matrix, and tire friction physics engine for AKR GT3-01 SPEC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
